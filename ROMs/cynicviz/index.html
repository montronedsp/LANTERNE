<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; top: 12px; left: 12px; pointer-events: none; z-index: 10; }
    #hud span {
      display: block;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(0, 255, 204, 0.7);
      line-height: 1.8;
    }
    #err {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      color: #ff4444;
      font-family: monospace;
      font-size: 13px;
      padding: 16px 24px;
      border: 1px solid #ff4444;
      z-index: 999;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="hud">
    <span id="hud-name">CynicViz</span>
    <span id="hud-rms">RMS: 0.00</span>
    <span id="hud-bass">BASS: 0.00</span>
    <span id="hud-fps"></span>
  </div>
  <div id="err"></div>
  <script src="lib/three.global.js"></script>
  <script src="main.js"></script>
</body>
</html>
