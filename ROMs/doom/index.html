<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doom</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas#doomCanvas {
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      outline: none;
      cursor: crosshair;
    }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 5px 8px; text-align: center;
      font: 12px/1.5 monospace; color: #9fb0c0;
      background: rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
    #fps {
      position: fixed; top: 4px; left: 6px; display: none;
      font: 12px monospace; color: #5f5; pointer-events: none;
    }
    #error {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      font: 14px/1.6 monospace; color: #f66; text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>
  <canvas id="doomCanvas" tabindex="0"></canvas>
  <div id="hint">WASD move &amp; strafe &middot; Q / E turn &middot; F or Ctrl fire &middot; Space use &middot; Esc menu &middot; shareware Episode 1</div>
  <div id="fps"></div>
  <div id="error"></div>
  <script src="engine/doom.wasm.b64.js"></script>
  <script src="main.js"></script>
</body>
</html>
